name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.12'
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      # O098: one orchestrator runs the original Quality stages with
      # dependency-aware concurrency (engine measured-weight shards beside the
      # TypeScript lanes; packaging/recovery lanes inside the e2e window).
      # Every original command, environment, evidence directory and successor
      # gate is preserved; failures propagate like step gating. No budget or
      # timeout change: the job keeps its original 15 minutes.
      - name: Orchestrate parallel quality pipeline
        run: npm run ci:quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: i04-package-linux
          path: |
            build/i04-package-ci/
            build/i04-matrix-ci/summary.json
            build/i04-matrix-ci/cases.jsonl
            build/engine-tests/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: failure-traces-linux
          path: test-results/
          retention-days: 7
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.12'
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run engine:check
        if: runner.os != 'Windows'
        env:
          CI_ENGINE_TEST_SHARDS: '1'
          CI_ENGINE_TEST_REPORT_SINGLE: '1'
      # Diagnostic only: first-failure evidence; not acceptance or merge approval.
      - name: Windows engine first-failure diagnostic (not acceptance)
        if: runner.os == 'Windows'
        env:
          PYTEST_ADDOPTS: '-vv --maxfail=1 --tb=short --durations=20 --full-trace'
          CI_ENGINE_TEST_SHARDS: '2'
        run: |
          uv run --frozen python -c "import json, locale, os, sys; stream = open(os.devnull, 'w'); print(json.dumps({'python': sys.version, 'localeEncoding': locale.getencoding(), 'preferredEncoding': locale.getpreferredencoding(False), 'utf8Mode': sys.flags.utf8_mode, 'defaultFileEncoding': stream.encoding}, sort_keys=True)); stream.close()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run engine:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e -- --reporter=list,github,json --output=test-results/main
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/main/report.json
      - run: npm run package:dir
      - run: uv run --frozen python scripts/verify-i04-package.py release build/i04-package-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: i04-package-${{ matrix.os }}
          path: |
            build/i04-package-ci/
            build/engine-tests/
            test-results/
          retention-days: 7
