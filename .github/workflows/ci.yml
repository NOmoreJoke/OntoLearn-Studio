name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.12'
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - name: I04 complete matrix per-cell evidence
        run: >-
          uv run --frozen python -m pytest -p scripts.i04_matrix_evidence
          --i04-matrix-evidence build/i04-matrix-ci
          --i04-matrix-source-revision HEAD
          packages/engine/tests/test_job_store.py::test_atomic_job_fault_reconcile_matrix
          packages/engine/tests/test_i04_round_faults.py::test_round_job_progress_atomic_fault_matrix_fences_and_preserves_previous_round
          -q
      - run: npm run check
      - run: npm run verify:sources
      - name: Prepare Linux Chromium sandbox
        run: |
          ./node_modules/.bin/install-electron
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          stat -c '%U:%G %a %n' node_modules/electron/dist/chrome-sandbox
      - name: Install isolated native display controls
        run: sudo apt-get update && sudo apt-get install -y openbox xdotool
      - run: xvfb-run -a sh -c 'openbox > /tmp/i04-openbox.log 2>&1 & npm run test:e2e'
        env:
          DEBUG: pw:browser
          I02_EVIDENCE: test-results/i02-linux-evidence.json
      - name: I04 actual native recovery and persistent jobs
        run: |
          uv run --frozen python scripts/prepare-i04-fixture.py build/i04-native-ci
          xvfb-run -a sh -c 'openbox > /tmp/i04-native-openbox.log 2>&1 & npx playwright test tests/e2e/i04-jobs.spec.ts --grep "native renderer" --output=test-results/i04-native'
        env:
          I04_TEST_FIXTURE: ${{ github.workspace }}/build/i04-native-ci/fixture.json
          I04_NATIVE_ISOLATED: '1'
      - name: I04 reload and safe errors through the actual preload
        run: |
          uv run --frozen python scripts/prepare-i04-fixture.py build/i04-reload-ci --background-rounds 12
          xvfb-run -a sh -c 'openbox > /tmp/i04-reload-openbox.log 2>&1 & npx playwright test tests/e2e/i04-jobs.spec.ts --grep "reload re-queries" --output=test-results/i04-reload'
        env:
          I04_TEST_FIXTURE: ${{ github.workspace }}/build/i04-reload-ci/fixture.json
      - run: npm run package:dir
      - name: I04 coordinator exit reconciles the active renderer
        run: |
          uv run --frozen python scripts/prepare-i04-fixture.py build/i04-disconnect-ci
          xvfb-run -a sh -c 'openbox > /tmp/i04-disconnect-openbox.log 2>&1 & npx playwright test tests/e2e/i04-jobs.spec.ts --grep "coordinator exit" --output=test-results/i04-disconnect'
        env:
          I04_TEST_FIXTURE: ${{ github.workspace }}/build/i04-disconnect-ci/fixture.json
      - run: uv run --frozen python scripts/verify-i04-package.py release build/i04-package-ci
      - name: I04 packaged application recovery
        shell: bash
        run: |
          mapfile -t sandboxes < <(find release -type f -name chrome-sandbox)
          mapfile -t executables < <(find release -type f -name '@ontolearndesktop')
          test "${#sandboxes[@]}" -eq 1
          test "${#executables[@]}" -eq 1
          sudo chown root:root "${sandboxes[0]}"
          sudo chmod 4755 "${sandboxes[0]}"
          export ONTOLEARN_PACKAGED_EXECUTABLE="$GITHUB_WORKSPACE/${executables[0]}"
          uv run --frozen python scripts/prepare-i04-fixture.py build/i04-packaged-disconnect-ci
          I04_TEST_FIXTURE="$GITHUB_WORKSPACE/build/i04-packaged-disconnect-ci/fixture.json" xvfb-run -a sh -c 'openbox > /tmp/i04-packaged-disconnect-openbox.log 2>&1 & npx playwright test tests/e2e/i04-jobs.spec.ts --grep "coordinator exit" --output=test-results/i04-packaged-disconnect'
          uv run --frozen python scripts/prepare-i04-fixture.py build/i04-packaged-reload-ci --background-rounds 12
          I04_TEST_FIXTURE="$GITHUB_WORKSPACE/build/i04-packaged-reload-ci/fixture.json" xvfb-run -a sh -c 'openbox > /tmp/i04-packaged-reload-openbox.log 2>&1 & npx playwright test tests/e2e/i04-jobs.spec.ts --grep "reload re-queries" --output=test-results/i04-packaged-reload'
          uv run --frozen python scripts/prepare-i04-fixture.py build/i04-packaged-native-ci
          I04_TEST_FIXTURE="$GITHUB_WORKSPACE/build/i04-packaged-native-ci/fixture.json" I04_NATIVE_ISOLATED=1 xvfb-run -a sh -c 'openbox > /tmp/i04-packaged-native-openbox.log 2>&1 & npx playwright test tests/e2e/i04-jobs.spec.ts --grep "native renderer" --output=test-results/i04-packaged-native'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: i04-package-linux
          path: |
            build/i04-package-ci/
            build/i04-matrix-ci/summary.json
            build/i04-matrix-ci/cases.jsonl
            test-results/i04-*/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: failure-traces-linux
          path: test-results/
          retention-days: 7
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.12'
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run engine:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run package:dir
      - run: uv run --frozen python scripts/verify-i04-package.py release build/i04-package-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: i04-package-${{ matrix.os }}
          path: build/i04-package-ci/
          retention-days: 7
  verify-candidate:
    # 分级审查候选机械核验（报告模式，adopted_report_only）。信任链（W03）：校验器
    # 脚本从目标基线 base 树按固定清单提取到工作区外目录运行，候选树内脚本仅是
    # 待审对象；base 无脚本时进入 untrusted bootstrap（终态接收将拒绝该报告）。
    # 不使用 pull_request_target/workflow_run，不写标签，token 只读；终态由本地可信
    # CLI scripts/receive-ci-final-state.mjs 以官方 run/attempt 数据补齐。
    name: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERIFIER_FILES: >-
        scripts/verify-candidate.mjs scripts/lib/candidate-git.mjs
        scripts/lib/review-policy.mjs scripts/lib/classify.mjs
        scripts/lib/range-diff.mjs scripts/lib/checklist.mjs
        scripts/lib/ci-reception.mjs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Run base-tree trusted verifier (report mode)
        env:
          EVENT_FILE: ${{ github.event_path }}
        run: |
          set -euo pipefail
          emit_no_trusted_baseline() {
            reason="$1"
            event="$2"
            mkdir -p build/verify-candidate
            node -e '
              const fs = require("fs")
              const report = {
                schemaVersion: 1,
                status: "unknown",
                mode: "report_only",
                event: process.argv[1],
                reason: process.argv[2],
                note: "未建立已核目标基线绑定：不执行可信 base 校验、不运行可信校验器；本报告不可作为放行依据（终态接收将拒绝 unknown）",
              }
              fs.writeFileSync(
                "build/verify-candidate/report.json",
                JSON.stringify(report, null, 2) + "\n",
              )
            ' "$event" "$reason"
            echo "::error::verify-candidate fail-closed：${reason}（事件 ${event}），仅生成 unknown 报告，未运行可信校验器"
            exit 1
          }
          event="${GITHUB_EVENT_NAME:-local}"
          checkout_sha="${GITHUB_SHA}"
          expect_args=()
          if [ "$event" = "pull_request" ]; then
            base="$(git rev-parse "${checkout_sha}^1")"
            head="$(git rev-parse "${checkout_sha}^2")"
            expect_head="$(node -e "const e=JSON.parse(require('fs').readFileSync(process.env.EVENT_FILE,'utf8'));process.stdout.write(e.pull_request?.head?.sha ?? '')")"
            expect_base="$(node -e "const e=JSON.parse(require('fs').readFileSync(process.env.EVENT_FILE,'utf8'));process.stdout.write(e.pull_request?.base?.sha ?? '')")"
            if [ -n "$expect_head" ]; then expect_args+=(--expect-pr-head "$expect_head"); fi
            if [ -n "$expect_base" ]; then expect_args+=(--expect-base "$expect_base"); fi
          elif [ "$event" = "push" ]; then
            base="$(node -e "const e=JSON.parse(require('fs').readFileSync(process.env.EVENT_FILE,'utf8'));process.stdout.write(e.before ?? '')")"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              # before 缺失/不可达（force-push 等）时无法建立可信基线绑定；
              # 父提交不被自动升级为可信 base，fail-closed。
              emit_no_trusted_baseline "no-trusted-push-baseline" "$event"
            fi
            head="$checkout_sha"
          else
            # workflow_dispatch：无法建立目标分支/审批基线的真实绑定（任意输入
            # SHA 或 feature 父提交都不构成已核可信 base）。fail-closed：不运行
            # 可信校验器，仅产出 unknown 报告并以失败退出，防止被当作可信 Pass。
            emit_no_trusted_baseline "no-trusted-dispatch-baseline" "$event"
          fi
          echo "verify-candidate identities: event=$event base=$base head=$head checkout=$checkout_sha"
          mkdir -p build/verify-candidate build/trusted-verifier/scripts/lib
          ok=1
          for f in $VERIFIER_FILES; do
            if git cat-file -e "${base}:${f}" 2>/dev/null; then
              mkdir -p "build/trusted-verifier/$(dirname "$f")"
              git cat-file blob "${base}:${f}" > "build/trusted-verifier/${f}"
            else
              ok=0
            fi
          done
          if [ "$ok" = "1" ]; then
            node -e '
              const { execFileSync } = require("child_process")
              const fs = require("fs")
              const base = process.argv[1]
              const files = process.env.VERIFIER_FILES.split(/\s+/)
              const provenance = { source: "base-tree", base, files: files.map((p) => ({
                path: p,
                blobSha: execFileSync("git", ["rev-parse", `${base}:${p}`], { encoding: "utf8" }).trim(),
              })) }
              fs.writeFileSync("build/verify-candidate/verifier-provenance.json", JSON.stringify(provenance, null, 2) + "\n")
            ' "$base"
            node build/trusted-verifier/scripts/verify-candidate.mjs \
              --repo-dir "$PWD" \
              --base "$base" \
              --head "$head" \
              --checkout "$checkout_sha" \
              --event "$event" \
              --verifier-provenance build/verify-candidate/verifier-provenance.json \
              --artifact-dir build/verify-candidate \
              --output build/verify-candidate/report.json \
              --summary-file "$GITHUB_STEP_SUMMARY" \
              "${expect_args[@]}"
          else
            echo '::warning::base 树无可信校验器（首次部署）：本报告为 untrusted bootstrap，终态接收将拒绝；须按旧门禁建立可信基线'
            printf '%s\n' '{"source":"candidate-tree-bootstrap","files":[]}' > build/verify-candidate/verifier-provenance.json
            node scripts/verify-candidate.mjs \
              --repo-dir "$PWD" \
              --base "$base" \
              --head "$head" \
              --checkout "$checkout_sha" \
              --event "$event" \
              --verifier-provenance build/verify-candidate/verifier-provenance.json \
              --artifact-dir build/verify-candidate \
              --output build/verify-candidate/report.json \
              --summary-file "$GITHUB_STEP_SUMMARY" \
              "${expect_args[@]}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-candidate-evidence
          path: build/verify-candidate/
          retention-days: 7
