[project]
name = "ontolearn-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ontolearn-engine"]

[tool.uv.sources]
ontolearn-engine = { workspace = true }

[tool.uv.workspace]
members = ["packages/engine"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
