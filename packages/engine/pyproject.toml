[project]
name = "ontolearn-engine"
version = "0.1.0"
description = "OntoLearn Studio local deterministic engine scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rdflib==7.6.0+ontolearn.fr201.1",
    "pyparsing==3.3.3",
    "pyshacl==0.30.1",
]

[project.scripts]
ontolearn-engine = "ontolearn_engine.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
rdflib = { path = "vendor/rdflib/rdflib-7.6.0+ontolearn.fr201.1-py3-none-any.whl" }
