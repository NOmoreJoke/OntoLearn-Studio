[project]
name = "ontolearn-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ontolearn-engine"]

[tool.uv.sources]
ontolearn-engine = { workspace = true }

[tool.uv.workspace]
members = ["packages/engine"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Historical records retain bytes; these rule exceptions do not fix B023 closures.
[tool.ruff.format]
exclude = [
  "docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/complete-scope-result/check-protected-stat-only.py",
  "docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/final-followup/check-protected-stat-only.py",
  "docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/normal-recovery-dispatch/check-protected-stat-only.py",
  "docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/official-minimal-readback/check-protected-stat-only.py",
  "docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/post-intake-terminal-readback/check-protected-stat-only.py",
  "docs/reviews/T05/projection-R3-receiving/O-launch-preparation/minimax/verify-launch-input.py",
  "docs/reviews/T05/projection-R3-receiving/O-launch-preparation/verify-launch-input.py",
  "docs/reviews/T05/projection-R3-receiving/O-launch-preparation/zcode/verify-launch-input.py",
  "docs/reviews/T05/projection-R3-receiving/O-owned-repair-candidate/independent-owned-repair-review-first.md",
]

[tool.ruff.lint.per-file-ignores]
"docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/complete-scope-result/check-protected-stat-only.py" = ["B023", "E501", "I001", "UP017"]
"docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/final-followup/check-protected-stat-only.py" = ["B023", "E501", "I001", "UP017"]
"docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/normal-recovery-dispatch/check-protected-stat-only.py" = ["B023", "E501", "I001", "UP017"]
"docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/official-minimal-readback/check-protected-stat-only.py" = ["B023", "E501", "I001", "UP017"]
"docs/reviews/T05/projection-R3-receiving/O-launch-dispatch/post-intake-terminal-readback/check-protected-stat-only.py" = ["B023", "E501", "I001", "UP017"]
"docs/reviews/T05/projection-R3-receiving/O-launch-preparation/minimax/verify-launch-input.py" = ["E501", "I001"]
"docs/reviews/T05/projection-R3-receiving/O-launch-preparation/verify-launch-input.py" = ["E501", "I001"]
"docs/reviews/T05/projection-R3-receiving/O-launch-preparation/zcode/verify-launch-input.py" = ["E501", "I001"]
