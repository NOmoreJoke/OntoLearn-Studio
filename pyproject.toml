[project]
name = "ontolearn-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ontolearn-engine"]

[tool.uv.sources]
ontolearn-engine = { workspace = true }

[tool.uv.workspace]
members = ["packages/engine"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Fixed historical I05 checkers retain bytes; rule exceptions are not semantic repairs.
[tool.ruff.format]
exclude = [
  "docs/reviews/I05/active-source-hygiene/independent-applied-checker.py",
  "docs/reviews/I05/retained-source-review-triage/independent-triage-r1-applied-check.py",
  "docs/reviews/I05/retained-source-review-triage/independent-triage-r1-check.py",
  "docs/reviews/I05/source-package-probe-source/static-verify.py",
  "docs/reviews/I05/active-source-hygiene/lifecycle-review-r1/report.md",
]

[tool.ruff.lint.per-file-ignores]
"docs/reviews/I05/active-source-hygiene/independent-applied-checker.py" = ["B007", "B905", "E401", "E501", "E701", "E702", "I001"]
"docs/reviews/I05/retained-source-review-triage/independent-triage-r1-applied-check.py" = ["E401", "E501", "E701", "E702", "I001", "UP022"]
"docs/reviews/I05/retained-source-review-triage/independent-triage-r1-check.py" = ["E401", "E501", "E701", "E702", "F401", "I001", "UP022"]
"docs/reviews/I05/source-package-probe-source/static-verify.py" = ["E501"]
